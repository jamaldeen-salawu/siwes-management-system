{% extends 'base.html' %}

{% block content %}
<main class="premium-form-page">
    <header>
        <p class="premium-form-eyebrow">Account setup</p>
        <h1>Create supervisor account</h1>
    </header>
    <form method="post">
        {% csrf_token %}
        <h2>Account details</h2>
        {{ user_form.as_p }}
        <hr>
        <h2>Supervisor details</h2>
        {{ supervisor_form.as_p }}
        <div class="premium-form-actions">
            <button type="submit">Create account</button>
        </div>
    </form>
</main>
{% endblock content %}
