{% extends 'base.html' %}

{% block content %}
<main class="premium-form-page">
    <header>
        <p class="premium-form-eyebrow">Account setup</p>
        <h1>Choose your role</h1>
    </header>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="premium-form-actions">
            <button type="submit">Continue</button>
        </div>
    </form>
</main>
{% endblock content %}
