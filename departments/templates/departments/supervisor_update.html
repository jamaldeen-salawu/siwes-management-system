{% extends 'departments/staff_base.html' %}

{% block staff_content %}
<section class="department-form-page department-form-page-narrow premium-form-page">
    <header>
        <h1>Update Supervisor</h1>
        <p>Update the supervisor's account and department profile.</p>
    </header>

    <form method="post">
        {% csrf_token %}
        <h2>Account Information</h2>
        {{ user_form.as_p }}
        <hr>
        <h2>Supervisor Information</h2>
        {{ supervisor_form.as_p }}
        <div class="department-form-actions">
            <button type="submit">Save Changes</button>
            <a class="department-form-cancel" href="{% url 'departments:supervisor-list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock staff_content %}
