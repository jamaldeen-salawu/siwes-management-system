{% extends 'departments/staff_base.html' %}

{% block staff_content %}
<section class="department-form-page department-form-page-narrow premium-form-page">
    <header>
        <h1>Update Placement</h1>
        <p>Update this student's placement details.</p>
    </header>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="department-form-actions">
            <button type="submit">Update Placement</button>
            <a class="department-form-cancel" href="{% url 'departments:student-detail' view.kwargs.pk %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock staff_content %}
