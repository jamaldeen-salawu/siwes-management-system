{% extends 'departments/staff_base.html' %}

{% block staff_content %}
<section class="department-form-page department-form-page-narrow premium-form-page">
    <header>
        <h1>Update Department</h1>
        <p>Update the department details.</p>
    </header>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="department-form-actions">
            <button type="submit">Save Changes</button>
            <a class="department-form-cancel" href="{% url 'departments:department-view' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock staff_content %}
