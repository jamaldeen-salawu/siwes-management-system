{% extends 'base.html' %}

{% block content %}
<main class="premium-form-page">
    <header>
        <p class="premium-form-eyebrow">SIWES supervision</p>
        <h1>Welcome back</h1>
    </header>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="premium-form-actions">
            <a class="premium-form-cancel" href="{% url 'accounts:password-reset' %}">Forgot password?</a>
            <button type="submit">Sign in</button>
        </div>
    </form>
</main>
{% endblock content %}
