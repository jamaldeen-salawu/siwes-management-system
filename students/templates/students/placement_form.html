{% extends 'students/student_base.html' %}

{% block student_content %}
<main class="student-page student-page-narrow premium-form-page">
    <header class="premium-form-heading">
        <p class="premium-form-eyebrow">Placement</p>
        <h1>{% if object %}Update Placement{% else %}Create Placement{% endif %}</h1>
    </header>

    <form class="premium-form-card" method="post">
        {% csrf_token %}
        <h2>Placement Details</h2>
        {{ form.as_p }}
        <div class="student-form-actions">
            <a class="student-form-cancel" href="{% url 'students:profile' %}">Cancel</a>
            <button type="submit">Save Placement</button>
        </div>
    </form>
</main>
{% endblock student_content %}
