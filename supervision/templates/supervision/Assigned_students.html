{% extends 'base.html' %}

{% block content %}
{% if students %}
<div>
    <ul>
        {% for student in students %} 
        <div>
            <li><a href="{% url 'supervision:student-detail' student.id %}">{{ student.user.first_name }} {{ student.user.last_name }}</a></li>
        </div>
        {% endfor %}
    </ul>
</div>
{% endif %}
{% endblock content %}
